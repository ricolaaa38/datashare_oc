name: datashare-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datashare_test
      POSTGRES_USER: datashare_test
      POSTGRES_PASSWORD: datashare_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build: ../backend
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: datashare_test
      DB_USER: datashare_test
      DB_PASSWORD: datashare_test
      S3_ENDPOINT: http://minio-test:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy

  frontend-test:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend-test:8080
    depends_on:
      - backend-test

  tests:
    build:
      context: ..
      dockerfile: tests/dockerfile
    environment:
      BACKEND_URL: http://backend-test:8080
      FRONTEND_URL: http://frontend-test:3000
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: datashare_test
      DB_USER: datashare_test
      DB_PASSWORD: datashare_test
      S3_ENDPOINT: http://minio-test:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      backend-test:
        condition: service_started
      frontend-test:
        condition: service_started
    volumes:
      - ./reports:/workspace/reports
      - ../backend:/backend
      - maven-cache:/root/.m2
    command: >
      sh -c "cd /backend && sh ./mvnw test -B &&
             cd /workspace && npm run test:e2e && npm run test:perf"

volumes:
  maven-cache:
