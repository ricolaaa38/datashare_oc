name: datashare-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datashare_test
      POSTGRES_USER: datashare_test
      POSTGRES_PASSWORD: datashare_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build: ../backend
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: datashare_test
      DB_USER: datashare_test
      DB_PASSWORD: datashare_test
      S3_ENDPOINT: http://minio-test:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend-test:3000
      JWT_SECRET_KEY: Y2zDqV9zZWNyw6h0ZV9wb3VyX3Rva2VuX2p3dF9hcHBfb2NfcDJfMjAyNg==
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy

  frontend-test:
    build:
      context: ../frontend
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at build
        # time, so this must be a build arg, not just an environment entry.
        NEXT_PUBLIC_API_URL: http://backend-test:8080
    depends_on:
      - backend-test
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://'+process.env.HOSTNAME+':3000/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 60

  tests:
    build:
      context: ..
      dockerfile: tests/dockerfile
    environment:
      BACKEND_URL: http://backend-test:8080
      FRONTEND_URL: http://frontend-test:3000
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: datashare_test
      DB_USER: datashare_test
      DB_PASSWORD: datashare_test
      S3_ENDPOINT: http://minio-test:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      COVERAGE_DIRECTORY: /workspace/reports/frontend
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      backend-test:
        condition: service_healthy
      frontend-test:
        condition: service_healthy
    volumes:
      - ./reports:/workspace/reports
      - ../backend:/backend
      - maven-cache:/root/.m2
    command: >
          sh -c "cd /backend && sh ./mvnw verify -B &&
            mkdir -p /workspace/reports/backend &&
            cp -R target/site/jacoco/. /workspace/reports/backend/ &&
            cd /frontend && npm run test:coverage &&
            cd /workspace && npm run test:e2e && npm run test:perf"

volumes:
  maven-cache:
