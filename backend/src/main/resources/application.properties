spring.application.name=datashare

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datashare}
spring.datasource.username=${DB_USER:datashare}
spring.datasource.password=${DB_PASSWORD:datashare}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

aws.s3.endpoint=${S3_ENDPOINT:}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.access-key=${S3_ACCESS_KEY:}
aws.s3.secret-key=${S3_SECRET_KEY:}
aws.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
aws.s3.bucket=${S3_BUCKET:datashare-files}

app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.upload.forbidden-extensions=${UPLOAD_FORBIDDEN_EXTENSIONS:.exe,.bat,.cmd,.sh,.msi,.dll,.com,.scr,.jar,.vbs,.ps1}

# Automatic deletion of expired files (content + metadata), every 15 minutes by default
app.cleanup.cron=${CLEANUP_CRON:0 */15 * * * *}
app.cleanup.batch-size=${CLEANUP_BATCH_SIZE:200}

# Throttling of password guessing on a download link
app.download.max-password-attempts=${DOWNLOAD_MAX_PASSWORD_ATTEMPTS:5}
app.download.lockout-seconds=${DOWNLOAD_LOCKOUT_SECONDS:300}
app.download.attempt-eviction-ms=${DOWNLOAD_ATTEMPT_EVICTION_MS:600000}

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

